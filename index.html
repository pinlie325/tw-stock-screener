<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>截圖標註板</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c212c">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: 左側垂直工具欄（分組：取得圖片／工具／顏色／大小／編號／編輯／輸出）+ 右側全高畫布 */
:root{
  --bg:#eef0f3; --panel:#ffffff; --line:#d5d9e0; --fg:#1d2330; --muted:#5f6878;
  --accent:#2f5bd3; --accent-soft:#e3eafc; --stage:#dfe3e9; --on-accent:#ffffff;
  --ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151922; --panel:#1c212c; --line:#2e3646; --fg:#e6e9ef; --muted:#8f99ab;
  --accent:#6f93ff; --accent-soft:#25304a; --stage:#0f1218; --on-accent:#0b1020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151922; --panel:#1c212c; --line:#2e3646; --fg:#e6e9ef; --muted:#8f99ab;
  --accent:#6f93ff; --accent-soft:#25304a; --stage:#0f1218; --on-accent:#0b1020; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);display:flex;gap:12px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px}

/* 側欄 */
.side{width:216px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  display:flex;flex-direction:column;overflow:hidden}
/* 視窗太矮時自動緊湊；再不夠就分成兩欄，永遠不出現捲軸 */
.side.compact .sec{padding:6px 10px;gap:5px}
.side.compact .tools button{padding:4px 8px}
.side.compact button{padding-block:5px}
.side.cols2{width:424px;display:block;column-count:2;column-gap:0;column-rule:1px solid var(--line)}
.side.cols2 .sec{break-inside:avoid;border-bottom:1px solid var(--line)}
.sec{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sec:last-child{border-bottom:0}
.sec h2{margin:0;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted)}
.row{display:flex;gap:6px}
.row>button{flex:1;justify-content:center}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tools button{justify-content:flex-start;padding:7px 8px}
.tools button kbd{margin-left:auto}

button{font:inherit;font-size:13px;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:7px;padding:7px 9px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
button:hover{background:var(--accent-soft)}
button:focus-visible,input:focus-visible,label.pick:focus-within{outline:2px solid var(--accent);outline-offset:1px}
button.on{background:var(--accent);color:var(--on-accent)}
button.primary{background:var(--accent);color:var(--on-accent)}
button.ghost{border-color:var(--line)}
button:disabled{opacity:.4;cursor:default;background:transparent}
kbd{font-family:var(--mono);font-size:10px;opacity:.6}
.ic{display:inline-block;width:16px;font-size:13px;line-height:1;text-align:center;overflow:hidden;font-family:var(--ui)}

#colors{display:grid;grid-template-columns:repeat(7,22px);justify-content:space-between;row-gap:8px;position:relative}
#colors>span{grid-column:1/-1;height:1px!important;width:auto!important;margin:0!important}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0;cursor:pointer}
.sw:hover{background:inherit}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.pick{width:22px;height:22px;border-radius:50%;border:1px dashed var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);cursor:pointer}
.pick:hover{border-color:var(--accent);color:var(--accent)}
#pick{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none}

.field{display:grid;grid-template-columns:2.6em 1fr;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.field input[type=range]{width:100%;margin:0}
.numrow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:6px 8px;border-radius:8px;border:1px dashed var(--line)}
.numrow.active{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
#numStart{width:3.4em;font:inherit;font-size:13px;text-align:center;padding:5px 4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.numrow button{margin-left:auto}

.foot{margin-top:auto;font-size:11.5px;color:var(--muted);line-height:1.7}
.foot details summary{cursor:pointer;color:var(--fg);font-size:12px;list-style:none}
.foot details summary::before{content:"▸ ";color:var(--muted)}
.foot details[open] summary::before{content:"▾ "}
.foot ul{margin:6px 0 0;padding:0;list-style:none}
.foot b{color:var(--fg);font-weight:500;font-family:var(--mono);font-size:11px}
.meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted)}

/* 畫布 */
.stage{flex:1;min-width:0;background:var(--stage);border-radius:12px;overflow:auto;position:relative;display:flex;align-items:flex-start;justify-content:center;padding:20px}
.wrap{position:relative;line-height:0;box-shadow:0 2px 14px rgba(0,0,0,.22);margin:auto}
canvas{display:block;max-width:100%;height:auto;touch-action:none}
#cv{cursor:crosshair}
#numEdit{position:absolute;z-index:4;width:3.4em;text-align:center;font:700 16px var(--ui);padding:4px;border:2px solid var(--accent);border-radius:6px;background:#fff;color:#000;line-height:normal;transform:translate(-50%,-50%)}
#txt{position:absolute;line-height:1.25;font-family:var(--ui);font-weight:700;border:1px dashed var(--accent);background:rgba(255,255,255,.85);color:#000;padding:2px 4px;resize:none;overflow:hidden;min-width:60px;outline:none;z-index:3}
.cropbar{position:absolute;z-index:4;display:flex;gap:6px;line-height:normal}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.export{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:8;padding:24px}
.export div{background:var(--panel);border-radius:10px;padding:14px;max-width:min(900px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.export img{max-width:100%;border:1px solid var(--line)}
.empty{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);line-height:1.6;padding:28px;border:2px dashed var(--line);border-radius:14px;max-width:460px}
.empty .big{font-family:var(--mono);font-size:40px;color:var(--fg);letter-spacing:.04em}
.empty b{color:var(--fg);font-weight:500}
.empty p{margin:0}.empty .sub{font-size:13px}
.drop{outline:3px dashed var(--accent);outline-offset:-8px}
@media (max-width:700px){body{flex-direction:column}.side,.side.cols2{width:auto;max-height:none;display:block;column-count:2}.side .sec{break-inside:avoid}.stage{min-height:300px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<aside class="side" role="toolbar" aria-label="工具">
  <section class="sec">
    <h2>取得圖片</h2>
    <div class="row">
      <button id="shot" class="primary" title="擷取螢幕畫面 (S)">⛶ 截圖 <kbd>S</kbd></button>
      <button id="open" class="ghost" title="開啟電腦裡的圖檔">開啟圖檔</button>
    </div>
    <input id="file" type="file" accept="image/*" hidden>
  </section>

  <section class="sec">
    <h2>輸出</h2>
    <button id="copy" class="primary" style="justify-content:center">複製圖片 <kbd>Ctrl+C</kbd></button>
    <button id="save" class="ghost" style="justify-content:center">另存圖片</button>
  </section>

  <section class="sec">
    <h2>編輯</h2>
    <div class="row">
      <button id="undo" class="ghost" title="復原 Ctrl+Z">↶ 復原</button>
      <button id="redo" class="ghost" title="重做 Ctrl+Y">↷ 重做</button>
    </div>
    <button id="clear" class="ghost" title="清除所有標註，保留圖片">清除所有標註</button>
  </section>

  <section class="sec">
    <h2>工具</h2>
    <div class="tools" id="tools">
      <button data-t="crop" title="修剪 (C)"><span class="ic">✂</span>修剪<kbd>C</kbd></button>
      <button data-t="arrow" title="箭頭 (A)"><span class="ic">➜</span>箭頭<kbd>A</kbd></button>
      <button data-t="pen" title="畫筆 (P)"><span class="ic">✎</span>畫筆<kbd>P</kbd></button>
      <button data-t="hl" title="螢光筆 (H)"><span class="ic">▬</span>螢光筆<kbd>H</kbd></button>
      <button data-t="line" title="直線 (L)"><span class="ic">╱</span>直線<kbd>L</kbd></button>
      <button data-t="rect" title="方框 (R)"><span class="ic">▢</span>方框<kbd>R</kbd></button>
      <button data-t="ell" title="圈選 (O)"><span class="ic">○</span>圈選<kbd>O</kbd></button>
      <button data-t="text" title="文字 (T)"><span class="ic">T</span>文字<kbd>T</kbd></button>
      <button data-t="tag" title="文字標籤 (G)"><span class="ic">▣</span>標籤<kbd>G</kbd></button>
      <button data-t="num" title="編號 (N)"><span class="ic">#</span>編號<kbd>N</kbd></button>
    </div>
    <div class="numrow" id="numOpt" title="編號設定">
      <label for="numStart" title="下一個放下去的編號，可改數字或英文字母"># 下一號</label>
      <input id="numStart" type="text" value="1" maxlength="3" autocomplete="off">
      <button id="numABC" class="ghost" title="切換 1,2,3 / A,B,C">1 ↔ A</button>
    </div>
  </section>

  <section class="sec">
    <h2>顏色</h2>
    <div id="colors"></div>
  </section>

  <section class="sec">
    <h2>大小</h2>
    <label class="field" for="size">粗細 <input id="size" type="range" min="1" max="12" value="4"></label>
    <label class="field" for="fsize">字級 <input id="fsize" type="range" min="12" max="72" value="26"></label>
  </section>

  <section class="sec foot" id="hint">
    <details>
      <summary>操作提示</summary>
      <ul>
        <li><b>Ctrl+V</b> 貼上截圖，或拖曳圖檔進來</li>
        <li><b>截圖</b> 選好視窗就截下來，並自動停止分享</li>
        <li><b>Shift</b> 拉水平線、正方形、正圓</li>
        <li><b>Delete</b> 刪除最後一筆</li>
        <li><b>點編號</b> 修改數字或字母</li>
        <li><b>＋</b> 自訂顏色，右鍵刪除</li>
      </ul>
    </details>
    <div class="meta"><span id="dim">尚未載入圖片</span><span id="ver">v2.4</span></div>
  </section>
</aside>

<div class="stage" id="stage">
  <div class="empty" id="empty">
    <div class="big">Ctrl + V</div>
    <p>先用 <b>Win + Shift + S</b> 截圖，回到這裡按 <b>Ctrl + V</b> 貼上</p>
    <p class="sub">或直接在這裡截圖、拖曳圖檔進來</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="primary" id="shot2">⛶ 截圖</button><button id="open2" style="border-color:var(--line)">開啟圖檔</button></div>
  </div>
  <div class="wrap" id="wrap" hidden>
    <canvas id="cv" width="800" height="500"></canvas>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const COLORS=["#e53935","#f9a825","#2e7d32","#1e63d6","#8e24aa","#000000","#ffffff"];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap');
let base=null;            // HTMLCanvasElement 底圖
let shapes=[];            // 標註物件
let hist=[],fut=[];
let tool='arrow',color=COLORS[0],cur=null,crop=null,numNext='1',txtBox=null;
const $=id=>document.getElementById(id);
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)};

// ---- 色票與工具 ----
const CKEY='annot.customColors';
let custom=[];try{custom=JSON.parse(localStorage.getItem(CKEY)||'[]').slice(0,6)}catch(e){}
function saveCustom(){try{localStorage.setItem(CKEY,JSON.stringify(custom))}catch(e){}}
function light(c){const n=parseInt(c.slice(1),16),R=n>>16&255,G=n>>8&255,B=n&255;return (0.299*R+0.587*G+0.114*B)>170}
function setColor(c){color=c.toLowerCase();document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x.title===color));$('pick').value=color}
function renderSwatches(){const box=$('colors');box.innerHTML='';
  const mk=(c,isCustom)=>{const b=document.createElement('button');b.className='sw'+(c===color?' on':'');b.style.background=c;b.title=c;
    b.setAttribute('aria-label',(isCustom?'自訂顏色 ':'顏色 ')+c);b.onclick=()=>setColor(c);
    if(isCustom)b.oncontextmenu=e=>{e.preventDefault();custom=custom.filter(x=>x!==c);saveCustom();renderSwatches();toast('已移除自訂顏色')};
    box.append(b)};
  COLORS.forEach(c=>mk(c,false));
  if(custom.length){const sep=document.createElement('span');sep.style.cssText='width:1px;height:18px;background:var(--line);margin:0 2px';box.append(sep)}
  custom.forEach(c=>mk(c,true));
  const lab=document.createElement('label');lab.className='pick';lab.title='自訂顏色';lab.htmlFor='pick';lab.innerHTML='＋';box.append(lab);
  let inp=$('pick');if(!inp){inp=document.createElement('input');inp.type='color';inp.id='pick';
    inp.addEventListener('input',e=>{color=e.target.value.toLowerCase();document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x.title===color))});
    inp.addEventListener('change',e=>{const c=e.target.value.toLowerCase();if(!COLORS.includes(c)&&!custom.includes(c)){custom.unshift(c);custom=custom.slice(0,6);saveCustom()}renderSwatches();setColor(c)})}
  inp.value=color;box.append(inp)}
renderSwatches();
function setTool(t){commitText();if(t==='hl'&&tool!=='hl'&&['#e53935','#000000','#ffffff'].includes(color))setColor('#f9a825');if(t!=='crop'){crop=null;removeCropBar()}tool=t;document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('numOpt').classList.toggle('active',t==='num');
  cv.style.cursor=t==='text'||t==='tag'?'text':'crosshair';draw()}
document.querySelectorAll('#tools button').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
setTool('arrow');

// ---- 歷史 ----
function snap(){hist.push({base,shapes:JSON.parse(JSON.stringify(shapes)),numNext});if(hist.length>60)hist.shift();fut=[];btns()}
function restore(s){base=s.base;shapes=s.shapes;numNext=s.numNext;cv.width=base.width;cv.height=base.height;draw();btns()}
function undo(){commitText();if(!hist.length)return;fut.push({base,shapes:JSON.parse(JSON.stringify(shapes)),numNext});restore(hist.pop())}
function redo(){if(!fut.length)return;hist.push({base,shapes:JSON.parse(JSON.stringify(shapes)),numNext});restore(fut.pop())}
function btns(){$('undo').disabled=!hist.length;$('redo').disabled=!fut.length}
$('undo').onclick=undo;$('redo').onclick=redo;
$('clear').onclick=()=>{if(!shapes.length)return;snap();shapes=[];numNext=numBase;draw()};

// ---- 載入圖片 ----
function loadImg(src,after){const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);
  if(base)snap();base=c;shapes=[];numNext=numBase;cv.width=c.width;cv.height=c.height;crop=null;removeCropBar();draw();
  $('empty').hidden=true;wrap.hidden=false;$('dim').textContent=`${c.width}×${c.height} px`;if(after)after();else toast('已貼上圖片')};im.src=src}
function loadFile(f){if(!f||!f.type.startsWith('image/'))return toast('這不是圖片檔');const r=new FileReader();r.onload=()=>loadImg(r.result);r.readAsDataURL(f)}
window.addEventListener('paste',e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(it){e.preventDefault();loadFile(it.getAsFile())}else toast('剪貼簿裡沒有圖片，先用 Win+Shift+S 截圖')});
$('open').onclick=$('open2').onclick=()=>$('file').click();
// ---- 螢幕截圖：第一次選要擷取的視窗或螢幕，之後每按一次就抓當下畫面 ----
let shotStream=null,shotVideo=null,shotTimer=null;
function stopShot(){clearTimeout(shotTimer);shotStream?.getTracks().forEach(t=>t.stop());shotStream=null;shotVideo=null}
async function takeShot(){
  if(!navigator.mediaDevices?.getDisplayMedia)return toast('這個瀏覽器不支援截圖，請改用 Win+Shift+S');
  commitText();
  try{
    if(!shotStream){
      // CaptureController：按完分享後留在截圖板，不跳到被截的分頁或視窗
      const ctl=('CaptureController' in window)?new CaptureController():null;
      const opt={video:{cursor:'never'},audio:false,selfBrowserSurface:'exclude',surfaceSwitching:'include'};if(ctl)opt.controller=ctl;
      shotStream=await navigator.mediaDevices.getDisplayMedia(opt);
      try{ctl?.setFocusBehavior('no-focus-change')}catch(e){}
      setTimeout(()=>window.focus(),0);
      shotStream.getVideoTracks()[0].addEventListener('ended',stopShot);
      shotVideo=document.createElement('video');shotVideo.muted=true;shotVideo.playsInline=true;shotVideo.srcObject=shotStream;
      await shotVideo.play();await new Promise(r=>setTimeout(r,350));
    }
    const v=shotVideo,c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
    if(!c.width)throw new Error('empty');
    c.getContext('2d').drawImage(v,0,0);
    stopShot(); // 截完立刻停止分享
    loadImg(c.toDataURL('image/png'),()=>{setTool('crop');toast('已截圖，拖曳框選要保留的範圍')});
  }catch(e){if(e&&e.name==='NotAllowedError'){stopShot();toast('已取消截圖')}else{stopShot();toast('無法截圖，請改用 Win+Shift+S 再按 Ctrl+V')}}
}
$('shot').onclick=$('shot2').onclick=takeShot;window.addEventListener('pagehide',stopShot);$('file').onchange=e=>{loadFile(e.target.files[0]);e.target.value=''};
const st=$('stage');
st.addEventListener('dragover',e=>{e.preventDefault();st.classList.add('drop')});
st.addEventListener('dragleave',()=>st.classList.remove('drop'));
st.addEventListener('drop',e=>{e.preventDefault();st.classList.remove('drop');loadFile(e.dataTransfer.files[0])});

// ---- 座標 ----
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
const scaleK=()=>cv.width/cv.getBoundingClientRect().width;
const lw=()=>+$('size').value*Math.max(1,cv.width/1000);
const fs=()=>+$('fsize').value*Math.max(1,cv.width/1200);
// ---- 編號 ----
function nextOf(n){n=String(n);if(/^\d+$/.test(n))return String(+n+1);
  if(/^[A-Ya-y]$/.test(n))return String.fromCharCode(n.charCodeAt(0)+1);return n}
function takeNum(){const n=String(numNext);numNext=nextOf(n);syncNum();return n}
function syncNum(){const i=$('numStart');if(i&&document.activeElement!==i)i.value=numNext}
let numBase='1';
$('numABC').onclick=()=>{numBase=numBase==='1'?'A':'1';numNext=numBase;syncNum();if(tool!=='num')setTool('num');toast('編號改為 '+(numBase==='1'?'1, 2, 3…':'A, B, C…'))};
$('numStart').addEventListener('input',e=>{const v=e.target.value.trim();if(v){numNext=v;if(/^[A-Za-z]$/.test(v))numBase=v===v.toUpperCase()?'A':'a';else if(/^\d+$/.test(v))numBase='1'}});
$('numStart').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')e.target.blur()});
$('numStart').addEventListener('blur',syncNum);
function hitNum(p){for(let i=shapes.length-1;i>=0;i--){const s=shapes[i];if(s.t==='num'&&Math.hypot(p.x-s.x,p.y-s.y)<=s.fs*.62*1.15)return s}return null}
function editNum(s){commitText();document.getElementById('numEdit')?.remove();
  const k=1/scaleK(),inp=document.createElement('input');inp.id='numEdit';inp.value=s.n;inp.maxLength=4;
  inp.style.left=s.x*k+'px';inp.style.top=s.y*k+'px';wrap.append(inp);setTimeout(()=>{inp.focus();inp.select()},0);
  let done=false;const fin=ok=>{if(done)return;done=true;const v=inp.value.trim();inp.remove();
    if(ok&&v&&v!==String(s.n)){snap();s.n=v;draw();toast('編號已改為 '+v)}};
  inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')fin(true);if(e.key==='Escape')fin(false)});
  inp.addEventListener('blur',()=>fin(true))}
cv.addEventListener('dblclick',e=>{if(!base||tool==='num')return;const s=hitNum(pt(e));if(s)editNum(s)});

// ---- 繪製 ----
function arrowHead(c,x1,y1,x2,y2,w){const a=Math.atan2(y2-y1,x2-x1),L=Math.max(12,w*4);
  c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-L*Math.cos(a-0.45),y2-L*Math.sin(a-0.45));c.lineTo(x2-L*Math.cos(a+0.45),y2-L*Math.sin(a+0.45));c.closePath();c.fill()}
function textLines(c,s){c.font=`700 ${s.fs}px ${getComputedStyle(document.body).fontFamily}`;return s.text.split('\n')}
function drawShape(c,s){c.save();c.strokeStyle=c.fillStyle=s.color;c.lineWidth=s.w;c.lineCap=c.lineJoin='round';
  if(s.t==='pen'||s.t==='hl'){if(s.t==='hl'){c.globalAlpha=.4;c.lineWidth=s.w*4;c.lineCap='butt'}
    c.beginPath();s.p.forEach((q,i)=>i?c.lineTo(q.x,q.y):c.moveTo(q.x,q.y));c.stroke()}
  else if(s.t==='line'||s.t==='arrow'){const L=Math.max(12,s.w*4)*0.8,a=Math.atan2(s.y2-s.y1,s.x2-s.x1);
    const ex=s.t==='arrow'?s.x2-L*Math.cos(a):s.x2,ey=s.t==='arrow'?s.y2-L*Math.sin(a):s.y2;
    c.beginPath();c.moveTo(s.x1,s.y1);c.lineTo(ex,ey);c.stroke();if(s.t==='arrow')arrowHead(c,s.x1,s.y1,s.x2,s.y2,s.w)}
  else if(s.t==='rect'){c.strokeRect(Math.min(s.x1,s.x2),Math.min(s.y1,s.y2),Math.abs(s.x2-s.x1),Math.abs(s.y2-s.y1))}
  else if(s.t==='ell'){c.beginPath();c.ellipse((s.x1+s.x2)/2,(s.y1+s.y2)/2,Math.abs(s.x2-s.x1)/2,Math.abs(s.y2-s.y1)/2,0,0,Math.PI*2);c.stroke()}
  else if(s.t==='text'||s.t==='tag'){const ls=textLines(c,s),lh=s.fs*1.25;c.textBaseline='top';
    if(s.t==='tag'){const pad=s.fs*.4,w=Math.max(...ls.map(l=>c.measureText(l).width));
      c.fillStyle=s.color;c.beginPath();c.roundRect(s.x-pad,s.y-pad*.7,w+pad*2,ls.length*lh+pad*1.2,s.fs*.2);c.fill();
      c.fillStyle=light(s.color)?'#000':'#fff';ls.forEach((l,i)=>c.fillText(l,s.x,s.y+i*lh))}
    else{c.lineWidth=Math.max(3,s.fs/7);c.strokeStyle=light(s.color)?'#000':'#fff';
      ls.forEach((l,i)=>{c.strokeText(l,s.x,s.y+i*lh);c.fillText(l,s.x,s.y+i*lh)})}}
  else if(s.t==='num'){const r=s.fs*.62;c.beginPath();c.arc(s.x,s.y,r,0,Math.PI*2);c.fill();c.lineWidth=Math.max(2,r/6);c.strokeStyle='#fff';c.stroke();
    c.fillStyle=light(s.color)?'#000':'#fff';const L=String(s.n).length;c.font=`700 ${r*(L<=1?1.15:L===2?.95:.7)}px ${getComputedStyle(document.body).fontFamily}`;c.textAlign='center';c.textBaseline='middle';c.fillText(s.n,s.x,s.y+r*.05)}
  c.restore()}
function render(c){c.drawImage(base,0,0);shapes.forEach(s=>drawShape(c,s))}
function draw(){syncNum();if(!base)return;ctx.clearRect(0,0,cv.width,cv.height);render(ctx);if(cur)drawShape(ctx,cur);
  if(crop){const x=Math.min(crop.x1,crop.x2),y=Math.min(crop.y1,crop.y2),w=Math.abs(crop.x2-crop.x1),h=Math.abs(crop.y2-crop.y1);
    ctx.save();ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.rect(0,0,cv.width,cv.height);ctx.rect(x,y,w,h);ctx.fill('evenodd');
    ctx.setLineDash([8*scaleK(),6*scaleK()]);ctx.strokeStyle='#fff';ctx.lineWidth=2*scaleK();ctx.strokeRect(x,y,w,h);
    ctx.fillStyle='#fff';ctx.font=`${13*scaleK()}px ${getComputedStyle(document.body).fontFamily}`;ctx.fillText(`${Math.round(w)}×${Math.round(h)}`,x+4*scaleK(),y-6*scaleK());ctx.restore()}}

// ---- 修剪 ----
function removeCropBar(){document.querySelector('.cropbar')?.remove()}
function showCropBar(){removeCropBar();const k=1/scaleK(),x=Math.max(crop.x1,crop.x2)*k,y=Math.max(crop.y1,crop.y2)*k;
  const d=document.createElement('div');d.className='cropbar';d.style.left=Math.max(0,x-170)+'px';d.style.top=Math.min(y+8,cv.getBoundingClientRect().height-40)+'px';
  d.innerHTML='<button class="primary" id="cOk">✓ 確定修剪 <kbd>Enter</kbd></button><button id="cNo" style="background:var(--panel)">取消 <kbd>Esc</kbd></button>';wrap.append(d);
  $('cOk').onclick=applyCrop;$('cNo').onclick=()=>{crop=null;removeCropBar();draw()}}
function applyCrop(){if(!crop)return;const x=Math.round(Math.min(crop.x1,crop.x2)),y=Math.round(Math.min(crop.y1,crop.y2)),w=Math.round(Math.abs(crop.x2-crop.x1)),h=Math.round(Math.abs(crop.y2-crop.y1));
  if(w<5||h<5)return;snap();const full=document.createElement('canvas');full.width=base.width;full.height=base.height;render(full.getContext('2d'));
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(full,x,y,w,h,0,0,w,h);
  base=c;shapes=[];cv.width=w;cv.height=h;crop=null;removeCropBar();draw();toast(`已修剪為 ${w}×${h}`);setTool('arrow')}

// ---- 文字輸入 ----
function startText(p,t){commitText();const ta=document.createElement('textarea');ta.id='txt';const k=1/scaleK(),f=fs();
  ta.style.left=p.x*k+'px';ta.style.top=p.y*k+'px';ta.style.fontSize=f*k+'px';ta.style.color=color;ta.style.background=light(color)?'rgba(0,0,0,.75)':'rgba(255,255,255,.85)';ta.rows=1;
  ta.placeholder='輸入文字';wrap.append(ta);setTimeout(()=>ta.focus(),0);txtBox={ta,x:p.x,y:p.y,t,fs:f,color};
  ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';ta.style.width='auto';ta.style.width=Math.max(60,ta.scrollWidth+8)+'px'});
  ta.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();commitText()}if(e.key==='Escape'){ta.value='';commitText()}});
  ta.addEventListener('blur',()=>setTimeout(commitText,0))}
function commitText(){if(!txtBox)return;const b=txtBox;txtBox=null;const v=b.ta.value.replace(/\s+$/,'');b.ta.remove();
  if(v){snap();shapes.push({t:b.t,x:b.x,y:b.y,fs:b.fs,color:b.color,text:v});draw()}}

// ---- 滑鼠 ----
let down=false;
cv.addEventListener('pointerdown',e=>{if(!base)return;const p=pt(e);
  if(tool==='text'||tool==='tag'){e.preventDefault();startText(p,tool);return}
  commitText();
  if(tool==='num'){const h=hitNum(p);if(h){editNum(h);return}snap();shapes.push({t:'num',x:p.x,y:p.y,fs:fs(),color,n:takeNum()});draw();return}
  cv.setPointerCapture(e.pointerId);down=true;
  if(tool==='crop'){removeCropBar();crop={x1:p.x,y1:p.y,x2:p.x,y2:p.y};return}
  cur=tool==='pen'||tool==='hl'?{t:tool,color,w:lw(),p:[p]}:{t:tool,color,w:lw(),x1:p.x,y1:p.y,x2:p.x,y2:p.y}});
cv.addEventListener('pointermove',e=>{if(!down)return;let p=pt(e);
  if(tool==='crop'){crop.x2=Math.max(0,Math.min(cv.width,p.x));crop.y2=Math.max(0,Math.min(cv.height,p.y));draw();return}
  if(!cur)return;
  if(cur.p){if(e.shiftKey&&tool==='hl'){cur.p=[cur.p[0],{x:p.x,y:cur.p[0].y}]}else cur.p.push(p)}
  else{if(e.shiftKey){const dx=p.x-cur.x1,dy=p.y-cur.y1;
      if(tool==='rect'||tool==='ell'){const m=Math.max(Math.abs(dx),Math.abs(dy));p={x:cur.x1+Math.sign(dx||1)*m,y:cur.y1+Math.sign(dy||1)*m}}
      else{const a=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4),d=Math.hypot(dx,dy);p={x:cur.x1+d*Math.cos(a),y:cur.y1+d*Math.sin(a)}}}
    cur.x2=p.x;cur.y2=p.y}draw()});
cv.addEventListener('pointerup',()=>{if(!down)return;down=false;
  if(tool==='crop'){if(crop&&Math.abs(crop.x2-crop.x1)>4&&Math.abs(crop.y2-crop.y1)>4)showCropBar();else crop=null;draw();return}
  if(cur){const ok=cur.p?cur.p.length>1:Math.hypot(cur.x2-cur.x1,cur.y2-cur.y1)>3;if(ok){snap();shapes.push(cur)}cur=null;draw()}});

// ---- 鍵盤 ----
const keyMap={s:'__shot',c:'crop',p:'pen',h:'hl',l:'line',a:'arrow',r:'rect',o:'ell',t:'text',g:'tag',n:'num'};
window.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'&&e.target.type!=='range')return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo();return}
  if((e.ctrlKey||e.metaKey)&&k==='c'){e.preventDefault();copyImg();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Enter'&&crop){applyCrop();return}
  if(e.key==='Escape'){crop=null;removeCropBar();draw();return}
  if((e.key==='Delete'||e.key==='Backspace')&&shapes.length){snap();const s=shapes.pop();if(s.t==='num')numNext=s.n;draw();return}
  if(keyMap[k]==='__shot'){takeShot();return}
  if(keyMap[k])setTool(keyMap[k])});

// ---- 匯出 ----
function exportCanvas(){commitText();if(!base){toast('請先貼上圖片');return null}const c=document.createElement('canvas');c.width=base.width;c.height=base.height;render(c.getContext('2d'));return c}
async function copyImg(){const c=exportCanvas();if(!c)return;try{const blob=await new Promise(r=>c.toBlob(r,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);toast('已複製，可直接貼到 LINE / Word')}
  catch(err){showExport(c,'這個視窗不允許直接寫入剪貼簿。請在下方圖片上按右鍵 →「複製圖片」。')}}
function showExport(c,msg){const o=document.createElement('div');o.className='export';
  o.innerHTML=`<div><div style="line-height:1.5;font-size:14px">${msg}</div><img alt="標註完成的圖片" src="${c.toDataURL('image/png')}"><button class="primary" style="align-self:flex-end">關閉</button></div>`;
  o.querySelector('button').onclick=()=>o.remove();o.onclick=e=>{if(e.target===o)o.remove()};document.body.append(o)}
$('copy').onclick=copyImg;
$('save').onclick=()=>{const c=exportCanvas();if(c)showExport(c,'在圖片上按右鍵 →「另存圖片」即可存檔（PNG）。')};

btns();
// ---- 側欄自動排列：放得下就單欄，放不下先緊湊、再分兩欄 ----
const side=document.querySelector('.side');
function fitSide(){if(matchMedia('(max-width:700px)').matches){side.classList.remove('compact','cols2');return}
  side.classList.remove('compact','cols2');
  const over=()=>side.scrollHeight>side.clientHeight+1;
  if(over()){side.classList.add('compact');if(over()){side.classList.remove('compact');side.classList.add('cols2')}}}
window.addEventListener('resize',fitSide);document.fonts?.ready.then(fitSide);fitSide();
document.querySelector('.foot details').addEventListener('toggle',fitSide);
</script>
